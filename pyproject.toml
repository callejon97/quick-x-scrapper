[project]
name = "tweet-thread-scraper"
version = "0.1.0"
description = "A desktop app for exporting X post quotes and replies"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7,<1",
    "playwright>=1.40,<2",
    "twscrape==0.20.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.14,<7",
]