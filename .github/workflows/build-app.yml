name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run pyinstaller --noconfirm --clean --onefile --windowed --collect-all twscrape --name TweetThreadScraper main.py
      - uses: actions/upload-artifact@v4
        with:
          name: TweetThreadScraper-${{ matrix.artifact }}
          path: dist/TweetThreadScraper*
          if-no-files-found: error